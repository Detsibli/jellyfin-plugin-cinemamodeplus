name: 'Cinema Mode Plus'
guid: '95a28cc1-e7c7-47b2-976b-32aa580be17e'
version: '0.7.2.0'
targetAbi: '10.11.0.0'
framework: 'net9.0'
owner: 'Detsibli'
overview: 'Cinema Mode with trailer libraries, local trailers and pre-rolls. Based on Cinema Mode by CherryFloors.'
description: >
  Enable Cinema Mode with local trailers, trailer libraries (including Trailers4Jellyfin downloads) and pre-rolls.
  Cinema Mode Plus is a fork of Cinema Mode by CherryFloors (https://github.com/CherryFloors/jellyfin-plugin-cinemamode),
  released under the MIT License.
category: 'General'
artifacts:
- 'Jellyfin.Plugin.CinemaModePlus.dll'
changelog:
  - Trailer Source is now Cinema (movie folder trailers), Trailers4Jellyfin, or Both.
  - Trailers4Jellyfin downloads are used by default when that source is picked; extra trailer libraries are optional.
  - Includes 0.7.1.0 fixes - no more missing intros when a movie library is ticked as a trailer library, warnings for
    trailer folders named "Trailers", and a per-movie intro summary in the log.
