name: Build

on:
  pull_request:
  push:
    branches-ignore:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Build
        run: dotnet build ./Jellyfin.Plugin.CinemaModePlus/Jellyfin.Plugin.CinemaModePlus.csproj --configuration Release
